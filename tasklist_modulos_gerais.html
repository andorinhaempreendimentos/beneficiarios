<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasklist: Módulos & Entidades — Andorinha</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .status-badge { transition: all 0.2s ease; }
    .status-pendente { background-color: rgba(161, 161, 170, 0.15); color: #71717a; border-color: #a1a1aa; }
    .status-executando { background-color: rgba(59, 130, 246, 0.15); color: #2563eb; border-color: #3b82f6; }
    .status-passou { background-color: rgba(34, 197, 94, 0.15); color: #16a34a; border-color: #22c55e; }
    .status-falhou { background-color: rgba(239, 68, 68, 0.15); color: #dc2626; border-color: #ef4444; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 antialiased p-4 md:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Cabeçalho -->
    <header class="bg-white border border-zinc-200 rounded-2xl p-6 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-3">
          <div class="h-3 w-3 rounded-full bg-sky-500 animate-pulse"></div>
          <span class="text-xs font-bold uppercase tracking-wider text-sky-700 bg-sky-50 px-2.5 py-0.5 rounded-full border border-sky-200">
            QA Suite • Módulos & Entidades
          </span>
        </div>
        <h1 class="text-2xl font-bold text-zinc-900 mt-2">Plano de Testes: Módulos do Sistema</h1>
        <p class="text-xs text-zinc-500 mt-0.5">Validação de formulários, CRUDs e regras de negócio de todas as entidades</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <div class="inline-flex rounded-xl border border-zinc-200 bg-zinc-100 p-1 text-xs font-medium">
          <button id="btn-tab-todos" onclick="setFilter('todos')" class="px-3 py-1.5 rounded-lg bg-white shadow-xs text-zinc-900 font-semibold cursor-pointer transition">
            Todos (30)
          </button>
          <button id="btn-tab-criticos" onclick="setFilter('criticos')" class="px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 font-semibold cursor-pointer transition flex items-center gap-1.5">
            <span>🔥</span> Críticos Dia a Dia (12)
          </button>
        </div>

        <button onclick="resetAll()" class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-zinc-300 hover:bg-zinc-100 transition text-zinc-700 cursor-pointer">
          Resetar Status
        </button>
      </div>
    </header>

    <!-- Métricas de Progresso -->
    <section class="bg-white border border-zinc-200 rounded-2xl p-5 shadow-xs space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <span class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Progresso Geral</span>
          <div class="flex items-baseline gap-2 mt-0.5">
            <span id="percent-text" class="text-3xl font-extrabold text-zinc-900">0%</span>
            <span id="counts-text" class="text-xs text-zinc-500 font-medium">0 de 0 concluídas</span>
          </div>
        </div>
        <div class="flex flex-wrap gap-2">
          <span id="badge-passou" class="px-2.5 py-1 rounded-full text-xs font-bold bg-green-50 text-green-700 border border-green-200">0 Passou</span>
          <span id="badge-criticos-count" class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">12 Críticos Dia a Dia</span>
          <span id="badge-executando" class="px-2.5 py-1 rounded-full text-xs font-bold bg-blue-50 text-blue-700 border border-blue-200">0 Em Execução</span>
          <span id="badge-pendente" class="px-2.5 py-1 rounded-full text-xs font-bold bg-zinc-100 text-zinc-700 border border-zinc-200">0 Pendente</span>
          <span id="badge-falhou" class="px-2.5 py-1 rounded-full text-xs font-bold bg-red-50 text-red-700 border border-red-200">0 Falhou</span>
        </div>
      </div>

      <!-- Barra de progresso -->
      <div class="w-full h-2.5 bg-zinc-100 rounded-full overflow-hidden flex">
        <div id="bar-passou" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
        <div id="bar-executando" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
        <div id="bar-falhou" class="h-full bg-red-500 transition-all duration-300" style="width: 0%"></div>
      </div>
    </section>

    <!-- Grupos de Tarefas -->
    <main id="task-groups" class="space-y-5"></main>

  </div>

          { id: "t1_conc", title: "1.2 CRUD de Concedentes", route: "/concedentes", entity: "concedentes", desc: "Cadastrar órgãos públicos parceiros (Secretarias, Prefeituras) e responsáveis pelo termo.", status: "passou", notes: "Aprovado: Criação via Modal, Edição, Busca e Soft-Delete validados com sucesso.", critico: false },

          { id: "t1_cargos", title: "1.4 Vagas e Cargos Previstos no Plano", route: "/objetos/[id]", entity: "objeto_cargos_previstos", desc: "Verificar quadro de cargos previstos no plano de trabalho vs profissionais alocados.", status: "passou", notes: "Aprovado: Sincronização automática de cargos, remunerações e carga horária no Postgres.", critico: false }

        badge: "Polos & Núcleos",
        tasks: [

          { id: "t2_coord", title: "2.2 Alocação de Coordenadores aos Núcleos", route: "/coordenadores", entity: "coordenador_nucleos", desc: "Vincular e desvincular coordenador de núcleo aos polos territoriais.", status: "passou", notes: "Aprovado: Atribuição e desvinculação com exclusão em tempo real no Postgres.", critico: false },

      },
      {

          { id: "t3_transf", title: "3.2 Transferência de Turma & Histórico", route: "/beneficiarios/[id]", entity: "beneficiario_turmas", desc: "Transferir aluno de turma/polo e verificar liberação de vaga na turma de origem.", status: "passou", notes: "Aprovado: Migração de turma com gravação do histórico de status 'transferido' e 'ativo'.", critico: true },

          { id: "t4_turma", title: "4.2 Wizard de Criação de Turmas", route: "/turmas/novo", entity: "turmas", desc: "Criar turma definindo faixa etária, capacidade máxima, polo e modalidade.", status: "passou", notes: "Aprovado: Wizard de criação de turma com capacidade, idades e filtros de polo.", critico: false },
          { id: "t4_horarios", title: "4.3 Gestão de Horários & Slots Semanais", route: "/turmas/[id]", entity: "turma_horarios", desc: "Cadastrar e alterar slots de aula da semana (dias, horário início e fim).", status: "passou", notes: "Aprovado: Configuração e persistência de slots de aula no Postgres.", critico: true },
          { id: "t4_resp", title: "4.4 Vinculação de Professores à Turma", route: "/turmas/[id]", entity: "turma_responsaveis", desc: "Alocar professor responsável e instrutor assistente na turma.", status: "passou", notes: "Aprovado: Vinculação de professores/instrutores em turma_responsaveis.", critico: true },
          { id: "t4_compl", title: "4.5 Atividades Complementares (Eventos/Torneios)", route: "/atividades-complementares", entity: "atividades_complementares", desc: "Cadastrar torneio, palestra ou evento especial com data e polo.", status: "passou", notes: "Aprovado: Criação de evento especial com número de participantes e data.", critico: false },

        ]
      },
      {
        id: "mod_5",
        title: "5. Recursos Humanos & Ponto Eletrônico",

          { id: "t5_func_reg", title: "5.2 Gestão de Funções & Registro de Classe", route: "/funcionarios/funcoes", entity: "funcoes", desc: "Criar cargos e configurar exigência de conselho profissional (CREF/CRESS).", status: "passou", notes: "Aprovado: Criação de funções com vínculo RBAC de perfil, regras de login e conselho de classe.", critico: false },
          { id: "t5_jornada", title: "5.3 Escala Semanal e Carga Horária", route: "/funcionarios/[id]", entity: "funcionario_jornada", desc: "Definir horários de trabalho semanais e carga horária contratada.", status: "passou", notes: "Aprovado: Definição de escala semanal, horários contratados de entrada/saída e vínculo.", critico: false },
          { id: "t5_ponto_avulso", title: "5.4 Registro de Ponto Avulso (/ponto)", route: "/ponto", entity: "registros_ponto", desc: "Bater ponto de entrada/saída via portal rápido com foto/geolocalização.", status: "passou", notes: "Aprovado: Registro de batida de ponto com hora, tipo de batida e gravação no banco.", critico: true },
          { id: "t5_espelho", title: "5.5 Espelho de Ponto & Banco de Horas", route: "/funcionarios/[id]/ponto", entity: "registros_ponto", desc: "Auditar folha de ponto mensal do colaborador e verificar cálculo de horas.", status: "passou", notes: "Aprovado: Cálculo consolidado de horas trabalhadas, espelho mensal e anotações homologadas.", critico: true }
        ]
      },
      {
        id: "mod_6",
        title: "6. Supervisão Pedagógica de Campo",
        badge: "Supervisão & Qualidade",
        tasks: [
          { id: "t6_visita", title: "6.1 Relatório de Visita In Loco", route: "/supervisoes/nova", entity: "supervisoes", desc: "Preencher checklist de visita técnica no polo (estrutura, presença, uniforme).", status: "passou", notes: "Aprovado: Preenchimento de checklist de visita in loco, presenças, avaliações e observações.", critico: true },
          { id: "t6_fotos", title: "6.2 Registro Fotográfico da Visita", route: "/supervisoes/[id]", entity: "supervisoes_fotos", desc: "Upload de fotos comprobatórias com geolocalização e evidência das atividades.", status: "passou", notes: "Aprovado: Registro e vinculação de fotos comprobatórias com categoria, legenda e ordenação.", critico: true },
          { id: "t6_mensal", title: "6.3 Relatório Mensal Consolidado", route: "/supervisoes/relatorio-mensal", entity: "supervisoes", desc: "Gerar relatório mensal de supervisões para prestação de contas.", status: "passou", notes: "Aprovado: Consolidação de visitas por núcleo, cálculo de média de presenças e avaliações qualitativas.", critico: false }
        ]
      },
      {
        id: "mod_7",
        title: "7. Materiais, Equipamentos & Estoque",
        badge: "Estoque & Patrimônio",
        tasks: [
          { id: "t7_mat", title: "7.1 Cadastro de Materiais de Consumo / Kits", route: "/estoque/materiais", entity: "materiais", desc: "Cadastrar bolas, coletes, cones e uniformes com unidade de medida.", status: "passou", notes: "Aprovado: Cadastro de materiais com categoria, unidade de medida, estoque mínimo e status.", critico: false },
          { id: "t7_equip", title: "7.2 Gestão de Equipamentos Patrimoniais", route: "/equipamentos", entity: "equipamentos", desc: "Cadastrar bens duráveis com número de tombamento e estado de conservação.", status: "passou", notes: "Aprovado: Gestão patrimonial com número de série/tombamento, polo e conservação física.", critico: false },
          { id: "t7_mov", title: "7.3 Movimentações & Transferências", route: "/estoque/movimentacoes", entity: "movimentacoes_estoque", desc: "Registrar entrada de compras e transferência de materiais para polos.", status: "passou", notes: "Aprovado: Registro de movimentações com atualização automática de saldo por polo.", critico: true },
          { id: "t7_termo", title: "7.4 Emissão de Termo de Entrega de Uniforme", route: "/estoque/termos", entity: "termos_entrega", desc: "Emitir termo de entrega de kit esportivo vinculado ao aluno com recibo.", status: "passou", notes: "Aprovado: Emissão de termos de cautela/entrega com controle de devolução e recebedor.", critico: true }
        ]
      },
      {
        id: "mod_8",
        title: "8. Governança, Prestação de Contas & Logs",
        badge: "Governança MROSC",
        tasks: [
          { id: "t8_salvar", title: "8.1 Salvar Versão Oficial da Prestação de Contas", route: "/relatorios", entity: "relatorios_prestacao_contas", desc: "Executar 'Salvar Versão Oficial' das 16 seções e verificar histórico.", status: "passou", notes: "Aprovado: Gravação de snapshot oficial com 16 seções, pareceres, signatários e status emitido.", critico: false },
          { id: "t8_pend", title: "8.2 Central de Pendências do Gestor", route: "/pendencias-gerais", entity: "pendencias_gerais", desc: "Auditar lista de alertas (PAR-Q pendente, aulas não concluídas, termos).", status: "passou", notes: "Aprovado: Central de pendências com filtros de gravidade, núcleo e fluxo de resolução.", critico: true },
          { id: "t8_config", title: "8.3 Configurações Globais & Glossário", route: "/configuracoes", entity: "configuracoes", desc: "Alterar parâmetros do sistema, metas globais e glossário de termos.", status: "passou", notes: "Aprovado: Configurações globais e dicionário de termos persistidos em JSONB.", critico: false },
          { id: "t8_audit", title: "8.4 Trilha de Auditoria (Logs)", route: "/configuracoes", entity: "audit_log", desc: "Verificar registro de logs de auditoria para ações críticas de usuários.", status: "passou", notes: "Aprovado: Trilha de auditoria completa com registro de ações, entidades e payloads antes/depois.", critico: false }
        ]
      },
      {
        id: "mod_9",
        title: "9. Autenticação & Permissões (RBAC)",
        badge: "Segurança & Usuários",
        tasks: [
          { id: "t9_user", title: "9.1 Criação & Gestão de Usuários", route: "/usuarios", entity: "usuarios", desc: "Criar novo usuário, vincular a funcionário/perfil e redefinir senha.", status: "passou", notes: "Aprovado: Criação, atualização de status, listagem e soft-delete de usuários validados.", critico: true },
          { id: "t9_perfis", title: "9.2 CRUD de Perfis de Acesso", route: "/usuarios/perfis", entity: "perfis", desc: "Criar e editar níveis de perfil (Admin, Coordenador, Instrutor, etc.).", status: "passou", notes: "Aprovado: CRUD de perfis customizados com descrição e status do sistema validados.", critico: false },
          { id: "t9_perm", title: "9.3 Matriz Granular de Permissões (CRUD)", route: "/usuarios/perfis/[id]", entity: "perfil_permissoes", desc: "Alterar permissões de tela/ação por módulo e testar bloqueio RLS.", status: "passou", notes: "Aprovado: Matriz granular de permissões (CRUD) por módulo persistida e validada no Postgres.", critico: false }
        ]
      }
    ];

    let filterMode = 'todos';
    let modules = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return INITIAL_MODULES;
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(modules));
      } catch (e) {}
      updateMetrics();
    }

    function setFilter(mode) {
      filterMode = mode;
      const btnTodos = document.getElementById("btn-tab-todos");
      const btnCriticos = document.getElementById("btn-tab-criticos");

      if (mode === 'criticos') {
        btnCriticos.className = "px-3 py-1.5 rounded-lg bg-white shadow-xs text-amber-900 font-bold cursor-pointer transition flex items-center gap-1.5 border border-amber-200";
        btnTodos.className = "px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 font-semibold cursor-pointer transition";
      } else {
        btnTodos.className = "px-3 py-1.5 rounded-lg bg-white shadow-xs text-zinc-900 font-semibold cursor-pointer transition";
        btnCriticos.className = "px-3 py-1.5 rounded-lg text-zinc-600 hover:text-zinc-900 font-semibold cursor-pointer transition flex items-center gap-1.5 border border-transparent";
      }

      render();
    }

    function updateTaskStatus(taskId, newStatus) {
      for (const m of modules) {
        const task = m.tasks.find(t => t.id === taskId);
        if (task) {
          task.status = newStatus;
          break;
        }
      }
      saveState();
      render();
    }

    function updateTaskNotes(taskId, notes) {
      for (const m of modules) {
        const task = m.tasks.find(t => t.id === taskId);
        if (task) {
          task.notes = notes;
          break;
        }
      }
      saveState();
    }

    function resetAll() {
      if (confirm("Deseja resetar todos os status para Pendente?")) {
        modules = JSON.parse(JSON.stringify(INITIAL_MODULES));
        saveState();
        render();
      }
    }

    function updateMetrics() {
      let total = 0, passou = 0, executando = 0, pendente = 0, falhou = 0, criticos = 0;
      for (const m of modules) {
        for (const t of m.tasks) {
          total++;
          if (t.critico) criticos++;
          if (t.status === "passou") passou++;
          else if (t.status === "executando") executando++;
          else if (t.status === "falhou") falhou++;
          else pendente++;
        }
      }

      const pct = total > 0 ? Math.round((passou / total) * 100) : 0;
      document.getElementById("percent-text").innerText = `${pct}%`;
      document.getElementById("counts-text").innerText = `${passou} de ${total} concluídas`;

      document.getElementById("badge-passou").innerText = `${passou} Passou`;
      document.getElementById("badge-criticos-count").innerText = `${criticos} Críticos Dia a Dia`;
      document.getElementById("badge-executando").innerText = `${executando} Em Execução`;
      document.getElementById("badge-pendente").innerText = `${pendente} Pendente`;
      document.getElementById("badge-falhou").innerText = `${falhou} Falhou`;

      document.getElementById("bar-passou").style.width = `${(passou / total) * 100}%`;
      document.getElementById("bar-executando").style.width = `${(executando / total) * 100}%`;
      document.getElementById("bar-falhou").style.width = `${(falhou / total) * 100}%`;
    }

    function render() {
      const container = document.getElementById("task-groups");
      container.innerHTML = "";

      modules.forEach(mod => {
        const filteredTasks = mod.tasks.filter(t => filterMode === 'todos' || t.critico);
        if (filteredTasks.length === 0) return;

        const groupEl = document.createElement("section");
        groupEl.className = "bg-white border border-zinc-200 rounded-2xl p-5 shadow-xs space-y-3";

        groupEl.innerHTML = `
          <div class="flex items-center justify-between border-b border-zinc-100 pb-2.5">
            <h2 class="text-base font-bold text-zinc-900">${mod.title}</h2>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-zinc-100 text-zinc-600 border border-zinc-200">
              ${mod.badge}
            </span>
          </div>
          <div class="space-y-2.5" id="tasks-${mod.id}"></div>
        `;

        const tasksContainer = groupEl.querySelector(`#tasks-${mod.id}`);

        filteredTasks.forEach(task => {
          const taskEl = document.createElement("div");
          const criticoCardClass = task.critico 
            ? "border-amber-200 bg-amber-50/20 hover:bg-amber-50/40 shadow-xs ring-1 ring-amber-100" 
            : "border-zinc-200 bg-zinc-50/50 hover:bg-zinc-50";

          taskEl.className = `p-3.5 rounded-xl border transition space-y-2.5 ${criticoCardClass}`;

          const badgeClasses = {
            pendente: "status-pendente",
            executando: "status-executando",
            passou: "status-passou",
            falhou: "status-falhou"
          }[task.status];

          const criticoTag = task.critico 
            ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300 flex items-center gap-1">
                 <span>🔥</span> Crítico Diário
               </span>`
            : "";

          taskEl.innerHTML = `
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-2.5">
              <div class="space-y-0.5">
                <div class="flex flex-wrap items-center gap-2">
                  <h3 class="text-xs font-bold text-zinc-900">${task.title}</h3>
                  ${criticoTag}
                  <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-zinc-200/70 text-zinc-700 font-semibold">${task.route}</span>
                  <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-sky-50 text-sky-700 border border-sky-200 font-medium">${task.entity}</span>
                </div>
                <p class="text-[11px] text-zinc-500 leading-relaxed">${task.desc}</p>
              </div>

              <!-- Status Switcher -->
              <div class="flex items-center gap-1.5 shrink-0">
                <select onchange="updateTaskStatus('${task.id}', this.value)" class="text-xs font-bold rounded-lg border px-2 py-1 status-badge ${badgeClasses} cursor-pointer outline-none">
                  <option value="pendente" ${task.status === 'pendente' ? 'selected' : ''}>⏳ Pendente</option>
                  <option value="executando" ${task.status === 'executando' ? 'selected' : ''}>🔄 Em Execução</option>
                  <option value="passou" ${task.status === 'passou' ? 'selected' : ''}>✅ Passou</option>
                  <option value="falhou" ${task.status === 'falhou' ? 'selected' : ''}>❌ Falhou</option>
                </select>
              </div>
            </div>

            <!-- Notes field -->
            <div>
              <input 
                type="text" 
                placeholder="Observações do teste..." 
                value="${task.notes || ''}" 
                oninput="updateTaskNotes('${task.id}', this.value)"
                class="w-full text-xs px-2.5 py-1 rounded-lg border border-zinc-200 bg-white text-zinc-800 placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-sky-500"
              />
            </div>
          `;
          tasksContainer.appendChild(taskEl);
        });

        container.appendChild(groupEl);
      });

      updateMetrics();
    }

    render();
  </script>
</body>
</html>
