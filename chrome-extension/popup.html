<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Preenchedor Automático</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .icon-badge {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #0284c7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      color: #38bdf8;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 2px 0 0 0;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
      margin-bottom: 8px;
      box-sizing: border-box;
    }
    .btn:last-child {
      margin-bottom: 0;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-success {
      background: #16a34a;
      color: #ffffff;
    }
    .btn-success:hover {
      background: #15803d;
    }
    .status {
      font-size: 11px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #064e3b;
      color: #4ade80;
      border: 1px solid #059669;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon-badge">⚡</div>
    <div>
      <h1>Preenchedor de Beneficiário</h1>
      <p>Escolinhas de Futebol e Futsal</p>
    </div>
  </div>

  <div class="card">
    <button id="btnPreencher" class="btn btn-primary">
      ✨ Preencher Aluno Padrão (12 Anos)
    </button>
    
    <button id="btnPreencherAleatorio" class="btn btn-success">
      🎲 Gerar e Preencher Aluno Aleatório
    </button>
  </div>

  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
