<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Interativo de Testes Manuais - Projeto Andorinha</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .form-checkbox { accent-color: #0284c7; }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-800 antialiased min-h-screen py-8 px-4 sm:px-8">

  <div class="max-w-5xl mx-auto flex flex-col gap-6">

    <!-- Header do Painel -->
    <header class="bg-white rounded-2xl border border-zinc-200/80 p-6 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="h-12 w-12 rounded-xl bg-sky-600 flex items-center justify-center text-white font-bold text-2xl shadow-xs">
          📋
        </div>
        <div>
          <h1 class="text-xl font-bold text-zinc-900 leading-tight">Checklist de Homologação & Testes Manuais</h1>
          <p class="text-xs text-zinc-500 font-medium">Banco de Dados JSON em Disco: <code class="bg-zinc-100 px-1.5 py-0.5 rounded text-sky-700 font-mono">checklist_testes.json</code></p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span id="badgeStatusDb" class="inline-flex items-center gap-1.5 rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 border border-emerald-200">
          <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          DB Conectado
        </span>
        <button onclick="resetarProgresso()" class="text-xs font-semibold text-zinc-600 bg-zinc-100 hover:bg-zinc-200 px-3 py-2 rounded-xl border border-zinc-200 transition-colors cursor-pointer">
          Resetar Banco
        </button>
      </div>
    </header>

    <!-- Barra de Progresso & Métricas -->
    <div class="bg-white rounded-2xl border border-zinc-200/80 p-6 shadow-xs flex flex-col gap-4">
      <div class="flex items-center justify-between">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-zinc-400">Progresso dos Testes</span>
          <h2 id="textoProgresso" class="text-2xl font-extrabold text-zinc-900">0% Concluído</h2>
        </div>
        <div class="flex items-center gap-4 text-xs font-medium">
          <span class="inline-flex items-center gap-1.5 bg-sky-50 text-sky-700 px-3 py-1.5 rounded-lg border border-sky-200">
            Total: <strong id="totalTestes">0</strong>
          </span>
          <span class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-lg border border-emerald-200">
            Concluídos: <strong id="concluidosTestes">0</strong>
          </span>
          <span class="inline-flex items-center gap-1.5 bg-amber-50 text-amber-700 px-3 py-1.5 rounded-lg border border-amber-200">
            Pendentes: <strong id="pendentesTestes">0</strong>
          </span>
        </div>
      </div>

      <!-- Progress bar track -->
      <div class="w-full bg-zinc-100 rounded-full h-3 overflow-hidden border border-zinc-200/60">
        <div id="barraProgresso" class="bg-sky-600 h-3 rounded-full transition-all duration-300 w-0"></div>
      </div>
    </div>

    <!-- Barra de Filtros & Busca Dinâmica -->
    <div class="bg-white rounded-2xl border border-zinc-200/80 p-4 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-3">
      <div class="w-full sm:w-80">
        <input type="text" id="inputBusca" oninput="filtrarTestes()" placeholder="Buscar teste por nome, tabela ou descrição..."
          class="w-full rounded-xl border border-zinc-300 px-3.5 py-2 text-xs transition-all focus:border-sky-500 focus:ring-2 focus:ring-sky-500/20 outline-none">
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto">
        <select id="selectModulo" onchange="filtrarTestes()" class="rounded-xl border border-zinc-300 px-3 py-2 text-xs bg-white outline-none">
          <option value="">Todos os Módulos</option>
        </select>

        <select id="selectStatus" onchange="filtrarTestes()" class="rounded-xl border border-zinc-300 px-3 py-2 text-xs bg-white outline-none">
          <option value="">Todos os Status</option>
          <option value="pendente">Pendentes</option>
          <option value="concluido">Concluídos</option>
        </select>
      </div>
    </div>

    <!-- Lista de Testes Manuais por Módulo -->
    <div id="listaTestes" class="flex flex-col gap-6">
      <div class="text-center py-12 text-zinc-400 text-sm">Carregando dados de checklist_testes.json...</div>
    </div>

  </div>

  <script>
    let testesData = [];
    let passosemitidosAbertos = {};
    const API_URL = window.location.origin.includes('http') ? '/api/testes' : 'http://localhost:3001/api/testes';

    // Carregar JSON do Banco de Dados em Disco
    async function carregarTestes() {
      try {
        const response = await fetch(API_URL);
        if (response.ok) {
          testesData = await response.json();
          document.getElementById('badgeStatusDb').innerHTML = `
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            DB Conectado (JSON em Disco)
          `;
        } else {
          throw new Error('Falha HTTP');
        }
      } catch (e) {
        console.warn('Servidor local não detectado:', e);
      }

      popularFiltrosModulos();
      renderizar();
    }

    // Salvar alterações diretamente no banco JSON em disco
    async function salvarNoBancoJSON() {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(testesData)
        });
        if (!res.ok) throw new Error('Erro ao salvar');
      } catch (e) {
        console.warn('Erro ao salvar no arquivo JSON via HTTP:', e);
      }
    }

    // Popular opções do select de módulos
    function popularFiltrosModulos() {
      const selectModulo = document.getElementById('selectModulo');
      const modulos = [...new Set(testesData.map(t => t.modulo))];
      selectModulo.innerHTML = '<option value="">Todos os Módulos</option>';
      modulos.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        selectModulo.appendChild(opt);
      });
    }

    // Alternar exibição do passo a passo
    function togglePassoAPasso(id) {
      passosemitidosAbertos[id] = !passosemitidosAbertos[id];
      renderizar();
    }

    // Alternar status de um teste e PERSISTIR no banco JSON
    async function toggleStatus(id) {
      const teste = testesData.find(t => t.id === id);
      if (teste) {
        teste.status = teste.status === 'concluido' ? 'pendente' : 'concluido';
        renderizar();
        await salvarNoBancoJSON();
      }
    }

    // Resetar banco de dados
    async function resetarProgresso() {
      if (confirm("Deseja resetar todos os testes para 'pendente' no banco checklist_testes.json?")) {
        testesData.forEach(t => t.status = 'pendente');
        renderizar();
        await salvarNoBancoJSON();
      }
    }

    // Filtrar testes por busca, módulo e status
    function filtrarTestes() {
      renderizar();
    }

    // Renderizar a interface principal
    function renderizar() {
      const busca = document.getElementById('inputBusca').value.toLowerCase().trim();
      const moduloSel = document.getElementById('selectModulo').value;
      const statusSel = document.getElementById('selectStatus').value;

      // Atualizar métricas globais
      const total = testesData.length;
      const concluidos = testesData.filter(t => t.status === 'concluido').length;
      const pendentes = total - concluidos;
      const pct = total > 0 ? Math.round((concluidos / total) * 100) : 0;

      document.getElementById('totalTestes').textContent = total;
      document.getElementById('concluidosTestes').textContent = concluidos;
      document.getElementById('pendentesTestes').textContent = pendentes;
      document.getElementById('textoProgresso').textContent = `${pct}% Concluído`;
      document.getElementById('barraProgresso').style.width = `${pct}%`;

      // Filtrar lista
      const filtrados = testesData.filter(t => {
        const matchBusca = !busca || t.titulo.toLowerCase().includes(busca) || t.tabela.toLowerCase().includes(busca) || t.descricao.toLowerCase().includes(busca);
        const matchModulo = !moduloSel || t.modulo === moduloSel;
        const matchStatus = !statusSel || t.status === statusSel;
        return matchBusca && matchModulo && matchStatus;
      });

      const container = document.getElementById('listaTestes');

      if (filtrados.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-zinc-200/80 p-8 text-center text-zinc-400 text-sm">
            Nenhum teste manual encontrado para os filtros selecionados.
          </div>
        `;
        return;
      }

      // Agrupar por módulo
      const porModulo = {};
      filtrados.forEach(t => {
        if (!porModulo[t.modulo]) porModulo[t.modulo] = [];
        porModulo[t.modulo].push(t);
      });

      let html = '';
      for (const [modulo, itens] of Object.entries(porModulo)) {
        html += `
          <section class="bg-white rounded-2xl border border-zinc-200/80 p-6 shadow-xs flex flex-col gap-4">
            <div class="border-b border-zinc-100 pb-3 flex items-center justify-between">
              <h3 class="text-base font-bold text-zinc-900">${modulo}</h3>
              <span class="text-xs text-zinc-400 font-medium">${itens.filter(i => i.status === 'concluido').length} de ${itens.length} concluídos</span>
            </div>

            <div class="flex flex-col gap-3">
              ${itens.map(item => {
                const aberto = !!passosemitidosAbertos[item.id];
                return `
                <div class="flex flex-col p-4 rounded-xl border ${item.status === 'concluido' ? 'border-emerald-200/80 bg-emerald-50/30' : 'border-zinc-200/80 bg-zinc-50/50'} hover:bg-zinc-50 transition-colors">
                  <div class="flex items-start justify-between gap-4">
                    <div class="flex items-start gap-3">
                      <input type="checkbox" ${item.status === 'concluido' ? 'checked' : ''} onchange="toggleStatus(${item.id})"
                        class="form-checkbox mt-1 h-4 w-4 rounded cursor-pointer">
                      <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="text-sm font-bold ${item.status === 'concluido' ? 'text-emerald-950 line-through' : 'text-zinc-900'}">${item.titulo}</span>
                          <span class="inline-flex items-center rounded-md bg-sky-50 px-2 py-0.5 text-[10px] font-mono font-semibold text-sky-700 border border-sky-200">
                            table: ${item.tabela}
                          </span>
                        </div>
                        <p class="text-xs text-zinc-600 leading-relaxed">${item.descricao}</p>
                      </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <button onclick="togglePassoAPasso(${item.id})" class="text-[11px] font-semibold text-sky-700 bg-sky-50 hover:bg-sky-100 px-2.5 py-1 rounded-lg border border-sky-200 transition-colors cursor-pointer">
                        ${aberto ? 'Ocultar Passo a Passo' : 'Ver Passo a Passo 📌'}
                      </button>
                      <span class="text-[10px] font-semibold uppercase px-2 py-0.5 rounded ${item.status === 'concluido' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                        ${item.status === 'concluido' ? 'Concluído' : 'Pendente'}
                      </span>
                    </div>
                  </div>

                  ${aberto && item.passoAPasso ? `
                    <div class="mt-3 pt-3 border-t border-zinc-200/60 bg-white p-3 rounded-lg flex flex-col gap-1.5 border border-zinc-200/80">
                      <span class="text-[11px] font-bold text-sky-800 uppercase tracking-wider">Roteiro de Teste Passo a Passo:</span>
                      <ul class="flex flex-col gap-1 text-xs text-zinc-700 pl-1">
                        ${item.passoAPasso.map(passo => `<li class="flex items-start gap-1.5"><span class="text-sky-600 font-bold">•</span> <span>${passo}</span></li>`).join('')}
                      </ul>
                    </div>
                  ` : ''}
                </div>
              `}).join('')}
            </div>
          </section>
        `;
      }

      container.innerHTML = html;
    }

    // Inicializar na carga da página
    window.addEventListener('DOMContentLoaded', carregarTestes);
  </script>
</body>
</html>
